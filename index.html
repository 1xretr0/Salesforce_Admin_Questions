<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Salesforce Certification Exam Simulator covering Platform Administrator (PLAT-ADMN-201) and Platform App Builder, with study and exam modes and real-time scoring.">
  <title>Salesforce Exam Simulator — Admin &amp; App Builder</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
</head>
<body>

  <!-- ===== APP HEADER ===== -->
  <header class="app-header">
    <div class="header-top">
      <!-- Brand -->
      <div class="header-brand">
        <div class="logo-icon" id="exam-icon">☁️</div>
        <h1>
          <span id="exam-title">Salesforce Admin Simulator</span>
          <span id="exam-subtitle">PLAT-ADMN-201 · 150 Practice Questions</span>
        </h1>
      </div>

      <!-- Exam Switcher -->
      <div class="exam-switcher">
        <label for="exam-select">Exam</label>
        <select id="exam-select" aria-label="Choose certification exam"></select>
      </div>

      <!-- Global Score Matrix -->
      <div class="score-matrix">
        <div class="score-pill" id="pill-progress">
          📝 Progress: <span class="pill-value">0/150</span>
        </div>
        <div class="score-pill" id="pill-score">
          🎯 Score: <span class="pill-value">0.0%</span>
        </div>
        <div class="score-pill" id="pill-status">
          📊 Status: <span class="pill-value">Not Started</span>
        </div>

        <!-- Exam Timer (hidden by default) -->
        <div class="exam-timer" id="exam-timer">
          <span class="timer-icon">⏱️</span>
          <span id="timer-text">01:45:00</span>
        </div>

        <!-- Submit Exam Button (hidden by default) -->
        <button class="submit-exam-btn" id="submit-exam-btn">Submit Exam</button>
      </div>

      <!-- Mode Toggle -->
      <div class="mode-toggle-wrapper">
        <label for="mode-toggle">Study</label>
        <input type="checkbox" class="toggle-switch" id="mode-toggle" aria-label="Toggle between Study and Exam mode">
        <label for="mode-toggle">Exam</label>
      </div>
    </div>

    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tab-nav" role="tablist" aria-label="Exam sections"></nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="app-container">
    <!-- Tab panes are generated per active exam by renderTabButtons() in app.js,
         since each exam has a different number of sections. -->
    <div class="tab-content" id="tab-content"></div>
  </main>

  <!-- ===== EXAM RESULTS OVERLAY ===== -->
  <div class="results-overlay" id="results-overlay">
    <div class="results-modal"></div>
  </div>

  <!-- ===== QUESTION DATA + APPLICATION SCRIPT ===== -->
  <script src="data/admin-questions.js?v=1"></script>
  <script src="data/appbuilder-questions.js?v=1"></script>
  <script src="app.js?v=2.0"></script>

</body>
</html>
